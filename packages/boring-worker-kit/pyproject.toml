[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boring-worker-kit"
version = "0.7.6"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING.md"]
description = "Worker side of the Pond: execution, file tools, task containment and settlement (Linux)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boring-file-core>=0.7.6,<0.8",
    "boring-registry>=0.7.6,<0.8",
    "mcp>=2.2.0,<2.3",
    "pydantic>=2.13,<3",
    "httpx2>=2.13,<3",
    "exceptiongroup>=1.3.1; python_version < '3.11'",
]

[project.scripts]
boring-worker-task = "boring_worker_kit.task_runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boring_worker_kit = ["py.typed"]
