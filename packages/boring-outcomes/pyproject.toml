[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boring-outcomes"
version = "0.8.0"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING.md"]
description = "One outcome vocabulary for the Pond family"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boring_outcomes = ["py.typed"]
