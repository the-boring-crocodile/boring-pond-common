[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boring-deploy"
version = "0.7.5"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING.md"]
description = "The deploy engine of the Pond family: one release of one component into its HOME"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boring_deploy = ["py.typed", "python_notices/*/*"]
